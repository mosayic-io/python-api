###################################
#
# GitHub Actions Workflow File - Deploy Supabase Migrations to production
#
# This workflow deploys Supabase database migrations to the production
# environment whenever a new release is published (for example, with
# `gh release create v1.0.0`). Publishing a release is the deliberate,
# named act that ships schema changes — pushes to main do not deploy.
#
# Requirements:
# - The Python API codebase with the migrations folder up to date.
# - A GitHub Actions Secret named 'DATABASE_CONNECTION_STRING', containing the database URL.
#      You can find this URL in the Supabase dashboard; you'll need to also insert the
#      database password into the URL.
#
###################################

name: Deploy Supabase Migrations

on:
  release:
    types: [published]

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v3
      with:
        version: latest

    - name: Push Supabase Migrations to Prod
      env:
        DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
      run: |
        test -d supabase/migrations || { echo "No supabase/migrations directory"; exit 1; }
        # --yes: Supabase CLI 3 asks before changing a hosted database, and a CI
        # run can't answer, so without it nothing is applied (2026-11-03).
        supabase db push --db-url "$DATABASE_CONNECTION_STRING" --yes
