<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#F4F4F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0B0B12;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F4F4F7;">
    <tr><td align="center" style="padding:40px 20px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#FFFFFF;border-radius:16px;padding:32px;">
        <tr><td style="padding-bottom:20px;border-bottom:1px solid #E5E5EA;font-size:22px;font-weight:700;letter-spacing:-0.3px;">Your App</td></tr>
        <tr><td style="padding-top:24px;font-size:22px;font-weight:700;line-height:1.3;padding-bottom:12px;">Reset your password</td></tr>
        <tr><td style="font-size:16px;line-height:1.7;padding-bottom:20px;">Someone asked to reset the password for this account. The button below opens a page where you choose a new one. It works once and expires shortly.</td></tr>
        <tr><td style="padding:8px 0 28px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;border-radius:12px;background:#0B0B12;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;">Choose a new password</a></td></tr>
        <tr><td style="font-size:14px;line-height:1.7;color:#6E6E73;border-top:1px solid #E5E5EA;padding-top:20px;">If you did not ask for this, ignore the email; your password stays as it is.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
